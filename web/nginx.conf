server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Live loading progress (server-sent events): pass bytes through immediately.
  location /api/v1/status/stream {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Same-origin API: no CORS needed.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API docs (OpenAPI document + Scalar UI) served by the API.
  location ~ ^/(openapi|scalar)(/|$) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths go to index.html so client-side routes work on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
